# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '29 8 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Run the pinned official CLI image directly: the action wrapper does not
      # forward Java encoding options, and this repository contains UTF-8 source.
      # Findings are reported to GitHub; scanner/report failures remain fatal.
      - name: Run Codacy Bandit analysis
        shell: bash
        run: |
          docker run --rm \
            --env JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 \
            --env CODACY_CODE="$GITHUB_WORKSPACE" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume /tmp:/tmp \
            --workdir "$GITHUB_WORKSPACE" \
            codacy/codacy-analysis-cli@sha256:339e0103e28804f9d76aff34503e505440e5d5b42f5dd70dae73b592ea87826a \
            -- analyze --tool bandit --verbose --format json \
            --output "$GITHUB_WORKSPACE/results.json" \
            --commit-uuid "$GITHUB_SHA" \
            --fail-if-incomplete --tool-timeout 10minutes \
            --gh-code-scanning-compat --max-allowed-issues 2147483647

      - name: Inspect scanner file paths
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          rows = json.loads(Path("results.json").read_text())
          print("RESULT COUNT", len(rows))
          for row in rows:
              for kind, issue in row.items():
                  filename = issue.get("filename") if isinstance(issue, dict) else None
                  if filename:
                      try:
                          Path(filename).read_text(encoding="utf-8")
                      except (UnicodeError, OSError) as error:
                          print("INVALID SOURCE", json.dumps(row), str(error))
          PYTHON
      - name: Save diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: codacy-diagnostic
          path: results.json
          retention-days: 1
