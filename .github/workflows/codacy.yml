name: Python Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '29 8 * * 3'

permissions:
  contents: read

jobs:
  bandit-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Use Bandit's official SARIF formatter, which retains native severity.
      # The legacy Codacy wrapper reported LOW test asserts as error-level alerts.
      - name: Install pinned scanner
        run: python -m pip install 'bandit[sarif]==1.9.4'
      - name: Scan every tracked Python file
        shell: bash
        run: |
          python - <<'PYTHON'
          import json
          import subprocess
          import sys
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          files = [name for name in tracked if name.endswith(".py")]
          if not files:
              raise RuntimeError("No tracked Python files found")
          result = subprocess.run([
              sys.executable, "-m", "bandit", "--quiet", "--format", "sarif",
              "--output", "results.sarif", *files,
          ], check=False)
          if result.returncode not in (0, 1):
              raise RuntimeError(f"Bandit execution failed: {result.returncode}")
          report = json.loads(Path("results.sarif").read_text(encoding="utf-8"))
          if not report.get("runs"):
              raise RuntimeError("Bandit produced no SARIF runs")
          for run in report["runs"]:
              invocations = run.get("invocations", [])
              if not invocations or any(item.get("executionSuccessful") is not True for item in invocations):
                  raise RuntimeError("Bandit analysis did not complete")
              for invocation in invocations:
                  if any(item.get("level") == "error" for item in invocation.get("toolExecutionNotifications", []) + invocation.get("toolConfigurationNotifications", [])):
                      raise RuntimeError("Bandit could not scan all tracked Python files")
          PYTHON
      - name: Upload unfiltered SARIF results
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: bandit-python
